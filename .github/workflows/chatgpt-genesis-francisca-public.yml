name: Genesis Francisca Neural Public
on:
  push:
    branches:
      - chatgpt/genesis-francisca-20260925
    paths:
      - 'chatgpt_genesis/roteiro.json'
      - 'chatgpt_genesis/generate_tts.py'
      - '.github/workflows/chatgpt-genesis-francisca-public.yml'
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/genesis-francisca-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Edge TTS from GitHub
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/rany2/edge-tts.git@master' mutagen
      - name: Generate pt-BR-FranciscaNeural
        run: python chatgpt_genesis/generate_tts.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_genesis/out
          git commit -m "chatgpt: generated Francisca Neural audio" || exit 0
          git push origin HEAD:chatgpt/genesis-francisca-20260925
