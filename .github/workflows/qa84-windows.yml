name: KELVOR QA 84 - Windows

on:
  workflow_dispatch:
    inputs:
      qa_zip_url:
        description: "HTTPS direct URL for KELVOR_QA_84_RECOVERY_v005_20260905.zip"
        required: true
        type: string
      qa_zip_sha256:
        description: "Expected SHA-256"
        required: true
        default: "c99e41fb9e77ce4b2664dcb04c2ab357f78775a5d4da16b0375b0eeacaa4d370"
        type: string

permissions:
  contents: read

jobs:
  qa84:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate Google Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            $cmd = Get-Command chrome.exe -ErrorAction SilentlyContinue
            if ($cmd) { $chrome = $cmd.Source }
          }
          if (-not $chrome) { throw "Google Chrome not found" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Chrome: $chrome"

      - name: Download and verify QA v005
        shell: pwsh
        run: |
          python scripts/download_and_verify.py `
            --url "${{ inputs.qa_zip_url }}" `
            --sha256 "${{ inputs.qa_zip_sha256 }}" `
            --output "$env:RUNNER_TEMP\KELVOR_QA_84_RECOVERY_v005_20260905.zip"

      - name: Extract QA v005
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP\kelvor-qa84"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\KELVOR_QA_84_RECOVERY_v005_20260905.zip" -DestinationPath $dst -Force
          $root = Get-ChildItem -Path $dst -Directory | Where-Object { $_.Name -eq "KELVOR_QA_84_RECOVERY_v005" } | Select-Object -First 1
          if (-not $root) { throw "KELVOR_QA_84_RECOVERY_v005 root not found" }
          "QA_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install QA dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:QA_ROOT\requirements.txt"

      - name: Integrity self-test
        shell: pwsh
        run: python "$env:QA_ROOT\RODAR_QA_84.py" --selftest

      - name: Run 84-state Gauntlet in headless Chrome
        shell: pwsh
        run: |
          $env:BROWSER = "python `"$env:GITHUB_WORKSPACE\scripts\ci_browser.py`" %s"
          python "$env:QA_ROOT\RODAR_QA_84.py" --timeout 180
          $code = $LASTEXITCODE
          "QA_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "KELVOR runner exit code: $code"
          exit 0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KELVOR-QA84-WINDOWS-${{ github.run_number }}
          path: |
            ${{ env.QA_ROOT }}/RESULTADOS_84/**
          if-no-files-found: error
          retention-days: 30

      - name: Enforce original runner verdict
        if: always()
        shell: pwsh
        run: |
          if (-not $env:QA_EXIT_CODE) { throw "QA runner did not record an exit code" }
          if ([int]$env:QA_EXIT_CODE -ne 0) { exit [int]$env:QA_EXIT_CODE }
