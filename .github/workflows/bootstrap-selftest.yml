name: KELVOR CI Bootstrap Self-Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-selftest.yml'
      - 'scripts/ci_browser.py'
      - 'scripts/download_and_verify.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localhost-chrome:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate Google Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            $cmd = Get-Command chrome.exe -ErrorAction SilentlyContinue
            if ($cmd) { $chrome = $cmd.Source }
          }
          if (-not $chrome) { throw "Google Chrome not found" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Chrome: $chrome"

      - name: Python syntax preflight
        shell: pwsh
        run: python -m py_compile scripts/ci_browser.py scripts/download_and_verify.py

      - name: Prove headless Chrome can reach 127.0.0.1
        shell: pwsh
        run: |
          @'
          import json, os, subprocess, sys, threading, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          marker = Path(os.environ['RUNNER_TEMP']) / 'kelvor_ci_localhost_hit.json'
          expected_path = '/kelvor-ci-selftest'

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  marker.write_text(json.dumps({
                      'path': self.path,
                      'user_agent': self.headers.get('User-Agent'),
                      'status': 'LOCALHOST_CHROME_REACHED'
                  }, indent=2), encoding='utf-8')
                  body=b'KELVOR CI localhost self-test OK'
                  self.send_response(200)
                  self.send_header('Content-Type','text/plain; charset=utf-8')
                  self.send_header('Content-Length',str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, fmt, *args):
                  pass

          server=ThreadingHTTPServer(('127.0.0.1', 8765), Handler)
          thread=threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          helper=Path(os.environ['GITHUB_WORKSPACE'])/'scripts'/'ci_browser.py'
          subprocess.check_call([sys.executable, str(helper), 'http://127.0.0.1:8765'+expected_path])
          deadline=time.time()+25
          while time.time()<deadline and not marker.exists():
              time.sleep(0.25)
          server.shutdown()
          if not marker.exists():
              raise SystemExit('Chrome headless did not reach localhost within 25 s')
          data=json.loads(marker.read_text(encoding='utf-8'))
          if data.get('path') != expected_path:
              raise SystemExit(f"Unexpected path: {data.get('path')}")
          print(json.dumps(data, indent=2))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\kelvor_localhost_selftest.py"
          python "$env:RUNNER_TEMP\kelvor_localhost_selftest.py"

      - name: Upload infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KELVOR-CI-BOOTSTRAP-SELFTEST-${{ github.run_number }}
          path: ${{ runner.temp }}/kelvor_ci_localhost_hit.json
          if-no-files-found: error
          retention-days: 30
