name: Genesis Final Audio Export
on:
  push:
    branches: [chatgpt-genesis-francisca-public]
    paths:
      - 'chatgpt_genesis/build_final_audio.py'
      - '.github/workflows/chatgpt-genesis-final-audio.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install pydub
      - name: Build 10-minute Francisca master
        run: python chatgpt_genesis/build_final_audio.py
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_genesis/export
          git commit -m "audio: build ten-minute Francisca master" || exit 0
          git push
