name: KELVOR RC39 v004 Runtime Diagnostic

on:
  push:
    paths:
      - 'scripts/diagnose_rc39_terminal.py'
      - 'patches/75-campaign-autoplay-stability-rc39-v005.js'
      - 'patches/76-campaign-autoplay-stability-rc39-v006.js'
      - 'patches/79-campaign-autoplay-stability-rc39-v009.js'
      - 'patches/81-campaign-autoplay-stability-rc39-v011.js'
      - 'patches/83-campaign-autoplay-safe-route-rc39-v013.js'
      - 'patches/88-campaign-autoplay-platform-flow-rc39-v018.js'
      - 'patches/90-campaign-autoplay-platform-timing-rc39-v020.js'
      - 'patches/91-campaign-autoplay-seal1-authored-route-rc39-v021.js'
      - 'patches/92-campaign-autoplay-seal1-edge-carry-rc39-v022.js'
      - 'patches/93-campaign-autoplay-seal1-measured-stage2-rc39-v023.js'
      - 'patches/94-campaign-autoplay-seal2-preclear-rc39-v024.js'
      - 'patches/95-campaign-autoplay-seal2-measured-entry-rc39-v025.js'
      - '.github/workflows/diagnose-rc39-v004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      RELEASE_ID: '383144921'
      EXPECTED_ASSET: KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905.zip
      EXPECTED_SHA256: 77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate Google Chrome
        shell: pwsh
        run: |
          $candidates=@('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe');$chrome=$candidates|Where-Object{Test-Path $_}|Select-Object -First 1;if(-not $chrome){$cmd=Get-Command chrome.exe -ErrorAction SilentlyContinue;if($cmd){$chrome=$cmd.Source}};if(-not $chrome){throw 'Google Chrome not found'};"CHROME_PATH=$chrome"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify published RC39 v004 asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release=(gh api "/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"|ConvertFrom-Json);$asset=$release.assets|Where-Object{$_.name -eq $env:EXPECTED_ASSET}|Select-Object -First 1;if(-not $asset){throw 'Required release asset missing'};$out="$env:RUNNER_TEMP\$env:EXPECTED_ASSET";curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" --output "$out";if($LASTEXITCODE -ne 0){throw 'Release asset download failed'};$got=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant();if($got -ne $env:EXPECTED_SHA256){throw "SHA mismatch $got"};$dst="$env:RUNNER_TEMP\rc39-v004";New-Item -ItemType Directory -Force -Path $dst|Out-Null;Expand-Archive -LiteralPath $out -DestinationPath $dst -Force;$root=Get-ChildItem -Path $dst -Directory|Where-Object{$_.Name -eq 'KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905'}|Select-Object -First 1;if(-not $root){throw 'Candidate root missing'};"CAMPAIGN_ROOT=$($root.FullName)"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply RC39 input-only patches through v025
        shell: pwsh
        run: |
          $runtimeDir="$env:CAMPAIGN_ROOT\web\release_v81_campaign_presentation_rc39_v004_20260905\src\runtime\v82";New-Item -ItemType Directory -Force -Path $runtimeDir|Out-Null;$files=@('75-campaign-autoplay-stability-rc39-v005.js','76-campaign-autoplay-stability-rc39-v006.js','79-campaign-autoplay-stability-rc39-v009.js','81-campaign-autoplay-stability-rc39-v011.js','83-campaign-autoplay-safe-route-rc39-v013.js','88-campaign-autoplay-platform-flow-rc39-v018.js','90-campaign-autoplay-platform-timing-rc39-v020.js','91-campaign-autoplay-seal1-authored-route-rc39-v021.js','92-campaign-autoplay-seal1-edge-carry-rc39-v022.js','93-campaign-autoplay-seal1-measured-stage2-rc39-v023.js','94-campaign-autoplay-seal2-preclear-rc39-v024.js','95-campaign-autoplay-seal2-measured-entry-rc39-v025.js');foreach($f in $files){Copy-Item "$env:GITHUB_WORKSPACE\patches\$f" "$runtimeDir\$f" -Force};$index="$env:CAMPAIGN_ROOT\web\index.html";$text=Get-Content -LiteralPath $index -Raw;$needle='<script src="./src/runtime/v81/74-campaign-integrated-gauntlet-rc39-v004.js"></script>';$tags=($files|ForEach-Object{'<script src="./src/runtime/v82/'+$_+'"></script>'}) -join "`r`n";if(-not $text.Contains($needle)){throw 'Gauntlet marker missing'};$text=$text.Replace($needle,$tags+"`r`n"+$needle);Set-Content -LiteralPath $index -Value $text -Encoding utf8
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Run terminal-state browser diagnostic with v025
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP\rc39-diagnostic";python scripts/diagnose_rc39_terminal.py --web "$env:CAMPAIGN_ROOT\web" --chrome "$env:CHROME_PATH" --out "$out" --seconds 330;"DIAG_OUT=$out"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KELVOR-RC39-V025-AUTOPLAY-DIAGNOSTIC-${{ github.run_number }}
          path: ${{ env.DIAG_OUT }}/**
          if-no-files-found: error
          retention-days: 30
