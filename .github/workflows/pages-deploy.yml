name: KELVOR Pages Preview

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'patches/101-owner-mobile-visual-feedback-rc39-v031.js'
      - 'patches/102-owner-experience-rc39-v032.js'
      - 'patches/103-owner-experience-gate-hotfix-rc39-v033.js'
      - 'patches/104-menu-map-polish-rc39-v034.js'
      - 'patches/105-menu-map-polish-rc39-v035.js'
      - 'patches/109-menu-map-responsive-rebuild-v039.js'
      - 'patches/110-menu-map-responsive-hotfix-v040.js'
      - 'patches/111-menu-map-premium-portrait-v041.js'
      - 'patches/112-menu-map-secondary-polish-v042.js'
      - 'patches/113-menu-secondary-final-polish-v043.js'
      - 'patches/114-secondary-screens-finish-v044.js'
      - 'patches/115-secondary-cleanup-v045.js'
      - 'patches/116-world-map-model-v046.js'
      - 'patches/117-world-map-scene-v046.js'
      - 'patches/118-menu-experience-v047.js'
      - 'assets/world-map/**'
      - 'assets/menu/**'
      - 'scripts/build_living_map.py'
      - 'scripts/build_menu_v047.py'
      - 'tests/world-map-*.test.cjs'
      - 'tests/menu*.test.cjs'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
    inputs:
      campaign_zip_url:
        description: "HTTPS direct URL for the RC39 v004 integrated campaign candidate"
        required: true
        type: string
      campaign_zip_sha256:
        description: "Expected SHA-256"
        required: true
        default: "77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RELEASE_ID: '383144921'
  EXPECTED_ASSET: KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905.zip
  EXPECTED_SHA256: 77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e
  OWNER_VISUAL_PATCH: 101-owner-mobile-visual-feedback-rc39-v031.js
  OWNER_EXPERIENCE_PATCH: 102-owner-experience-rc39-v032.js
  OWNER_GATE_PATCH: 103-owner-experience-gate-hotfix-rc39-v033.js
  MENU_MAP_PATCH: 104-menu-map-polish-rc39-v034.js
  MENU_MAP_POLISH_PATCH: 105-menu-map-polish-rc39-v035.js
  RESPONSIVE_REBUILD_PATCH: 109-menu-map-responsive-rebuild-v039.js
  RESPONSIVE_HOTFIX_PATCH: 110-menu-map-responsive-hotfix-v040.js
  PORTRAIT_PREMIUM_PATCH: 111-menu-map-premium-portrait-v041.js
  SECONDARY_POLISH_PATCH: 112-menu-map-secondary-polish-v042.js
  SECONDARY_FINAL_PATCH: 113-menu-secondary-final-polish-v043.js
  SECONDARY_FINISH_PATCH: 114-secondary-screens-finish-v044.js
  SECONDARY_CLEANUP_PATCH: 115-secondary-cleanup-v045.js

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify living map and menu behavior before building
        run: node --test tests/world-map-model.test.cjs tests/world-map-scene.test.cjs tests/menu*.test.cjs

      - name: Acquire and verify RC39 v004 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$EXPECTED_ASSET"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/download_and_verify.py \
              --url "${{ inputs.campaign_zip_url }}" \
              --sha256 "${{ inputs.campaign_zip_sha256 }}" \
              --output "$OUT"
            EXPECTED="${{ inputs.campaign_zip_sha256 }}"
          else
            if [ "${{ github.event_name }}" = "release" ]; then RID="${{ github.event.release.id }}"; else RID="$RELEASE_ID"; fi
            ASSET_ID="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RID" --jq ".assets[] | select(.name == \"$EXPECTED_ASSET\") | .id" | head -n 1)"
            test -n "$ASSET_ID"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" --output "$OUT"
            EXPECTED="$EXPECTED_SHA256"
          fi
          GOT="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "bytes=$(stat -c%s "$OUT")"
          echo "sha256=$GOT"
          test "$GOT" = "$(echo "$EXPECTED" | tr 'A-F' 'a-f')"
          echo "CAMPAIGN_ZIP=$OUT" >> "$GITHUB_ENV"

      - name: Build static Pages payload + promoted owner patches
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/baseline-v045"
          unzip -q "$CAMPAIGN_ZIP" -d "$RUNNER_TEMP/candidate"
          ROOT="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type d -name 'KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905' | head -n 1)"
          test -n "$ROOT"
          test -f "$ROOT/web/index.html"
          cp -a "$ROOT/web/." "$RUNNER_TEMP/baseline-v045/"
          REL="$RUNNER_TEMP/baseline-v045/release_v81_campaign_presentation_rc39_v004_20260905"
          mkdir -p "$REL/src/runtime/v82"
          PATCHES=(
            "$OWNER_VISUAL_PATCH"
            "$OWNER_EXPERIENCE_PATCH"
            "$OWNER_GATE_PATCH"
            "$MENU_MAP_PATCH"
            "$MENU_MAP_POLISH_PATCH"
            "$RESPONSIVE_REBUILD_PATCH"
            "$RESPONSIVE_HOTFIX_PATCH"
            "$PORTRAIT_PREMIUM_PATCH"
            "$SECONDARY_POLISH_PATCH"
            "$SECONDARY_FINAL_PATCH"
            "$SECONDARY_FINISH_PATCH"
            "$SECONDARY_CLEANUP_PATCH"
          )
          for PATCH in "${PATCHES[@]}"; do cp "$GITHUB_WORKSPACE/patches/$PATCH" "$REL/src/runtime/v82/$PATCH"; done
          python - "$RUNNER_TEMP/baseline-v045/index.html" "${PATCHES[@]}" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); names=sys.argv[2:]; text=p.read_text(encoding='utf-8')
          if '</body>' not in text: raise SystemExit('index body marker missing')
          tags=[]
          for name in names:
              tag=f'<script src="./src/runtime/v82/{name}"></script>'
              if tag not in text: tags.append(tag)
          if tags:
              text=text.replace('</body>','\n'.join(tags)+'\n</body>');p.write_text(text,encoding='utf-8')
          PY
          touch "$RUNNER_TEMP/baseline-v045/.nojekyll"
          for PATCH in "${PATCHES[@]}"; do grep -F "$PATCH" "$RUNNER_TEMP/baseline-v045/index.html"; test -f "$REL/src/runtime/v82/$PATCH"; done

      - name: Build isolated v046 and v047 previews alongside the preserved v045 URL
        run: |
          set -euo pipefail
          python scripts/build_living_map.py \
            --baseline "$RUNNER_TEMP/baseline-v045" \
            --output "$RUNNER_TEMP/candidate-v046" \
            --repo "$GITHUB_WORKSPACE"
          python scripts/build_menu_v047.py \
            --baseline "$RUNNER_TEMP/candidate-v046" \
            --output "$RUNNER_TEMP/candidate-v047" \
            --repo "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/site/v046" "$RUNNER_TEMP/site/v047"
          cp -a "$RUNNER_TEMP/baseline-v045/." "$RUNNER_TEMP/site/"
          cp -a "$RUNNER_TEMP/candidate-v046/." "$RUNNER_TEMP/site/v046/"
          cp -a "$RUNNER_TEMP/candidate-v047/." "$RUNNER_TEMP/site/v047/"
          python - "$RUNNER_TEMP/site" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()/'scripts'))
          from build_menu_v047 import inventory, verify_payload
          site=Path(sys.argv[1])
          for version, report_name, build_id in [
              ('v046','LIVING_MAP_BUILD_REPORT.json','kelvor-living-map-v046'),
              ('v047','MENU_BUILD_REPORT.json','kelvor-menu-v047'),
          ]:
              root=site/version
              report=json.loads((root/report_name).read_text(encoding='utf-8'))
              verify_payload(report, inventory(root, exclude=report_name), build_id)
              html=(root/'index.html').read_text(encoding='utf-8')
              names=['115-secondary-cleanup-v045.js','116-world-map-model-v046.js','117-world-map-scene-v046.js']
              if version=='v047':
                  names.append('118-menu-experience-v047.js')
                  assert '<title>KELVOR — A aventura começa (v047)</title>' in html
                  assert any((root/report['release_dir']/'assets/menu').rglob('*.png')), 'Menu art missing'
              positions=[html.index(name) for name in names]
              assert positions==sorted(positions), 'Candidate patches out of order'
              assert all(html.count(name)==1 for name in names), 'Duplicate candidate patch'
              assert (root/report['release_dir']/'assets/world-map/w01-living-map-v046.png').is_file()
              info={'candidate':version,'commit':sys.argv[2],'payload_sha256':report['candidate']['tree_sha256'],'visual_approval':'pending'}
              (root/'deployment.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
              print(f'Public candidate path: /{version}/; build',info)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
