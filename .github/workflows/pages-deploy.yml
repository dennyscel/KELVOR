name: KELVOR Pages Preview

on:
  release:
    types: [published]
  push:
    paths:
      - 'patches/101-owner-mobile-visual-feedback-rc39-v031.js'
      - 'patches/102-owner-experience-rc39-v032.js'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
    inputs:
      campaign_zip_url:
        description: "HTTPS direct URL for the RC39 v004 integrated campaign candidate"
        required: true
        type: string
      campaign_zip_sha256:
        description: "Expected SHA-256"
        required: true
        default: "77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RELEASE_ID: '383144921'
  EXPECTED_ASSET: KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905.zip
  EXPECTED_SHA256: 77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e
  OWNER_VISUAL_PATCH: 101-owner-mobile-visual-feedback-rc39-v031.js
  OWNER_EXPERIENCE_PATCH: 102-owner-experience-rc39-v032.js

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire and verify RC39 v004 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$EXPECTED_ASSET"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/download_and_verify.py \
              --url "${{ inputs.campaign_zip_url }}" \
              --sha256 "${{ inputs.campaign_zip_sha256 }}" \
              --output "$OUT"
            EXPECTED="${{ inputs.campaign_zip_sha256 }}"
          else
            if [ "${{ github.event_name }}" = "release" ]; then
              RID="${{ github.event.release.id }}"
            else
              RID="$RELEASE_ID"
            fi
            ASSET_ID="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RID" --jq ".assets[] | select(.name == \"$EXPECTED_ASSET\") | .id" | head -n 1)"
            test -n "$ASSET_ID"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
              --output "$OUT"
            EXPECTED="$EXPECTED_SHA256"
          fi
          GOT="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "bytes=$(stat -c%s "$OUT")"
          echo "sha256=$GOT"
          test "$GOT" = "$(echo "$EXPECTED" | tr 'A-F' 'a-f')"
          echo "CAMPAIGN_ZIP=$OUT" >> "$GITHUB_ENV"

      - name: Build static Pages payload + owner experience hotfixes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site"
          unzip -q "$CAMPAIGN_ZIP" -d "$RUNNER_TEMP/candidate"
          ROOT="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type d -name 'KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905' | head -n 1)"
          test -n "$ROOT"
          test -f "$ROOT/web/index.html"
          cp -a "$ROOT/web/." "$RUNNER_TEMP/site/"
          REL="$RUNNER_TEMP/site/release_v81_campaign_presentation_rc39_v004_20260905"
          mkdir -p "$REL/src/runtime/v82"
          for PATCH in "$OWNER_VISUAL_PATCH" "$OWNER_EXPERIENCE_PATCH"; do
            cp "$GITHUB_WORKSPACE/patches/$PATCH" "$REL/src/runtime/v82/$PATCH"
          done
          python - "$RUNNER_TEMP/site/index.html" "$OWNER_VISUAL_PATCH" "$OWNER_EXPERIENCE_PATCH" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); names=sys.argv[2:]
          text=p.read_text(encoding='utf-8')
          if '</body>' not in text: raise SystemExit('index body marker missing')
          tags=[]
          for name in names:
              tag=f'<script src="./src/runtime/v82/{name}"></script>'
              if tag not in text: tags.append(tag)
          if tags:
              text=text.replace('</body>','\n'.join(tags)+'\n</body>')
              p.write_text(text,encoding='utf-8')
          PY
          touch "$RUNNER_TEMP/site/.nojekyll"
          test -f "$RUNNER_TEMP/site/index.html"
          grep -F "$OWNER_VISUAL_PATCH" "$RUNNER_TEMP/site/index.html"
          grep -F "$OWNER_EXPERIENCE_PATCH" "$RUNNER_TEMP/site/index.html"
          test -f "$REL/src/runtime/v82/$OWNER_VISUAL_PATCH"
          test -f "$REL/src/runtime/v82/$OWNER_EXPERIENCE_PATCH"

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
