name: KELVOR RC39 v004 Release Source Probe

on:
  push:
    paths:
      - '.github/workflows/probe-rc39-release-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      RELEASE_ID: '383144921'
      EXPECTED_ASSET: KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905.zip
      EXPECTED_SHA256: 77e50fde0ac6fc392237616d2842814a92a6d6d392a54487b38321c339b2d36e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified RC39 v004 asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release=(gh api "/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"|ConvertFrom-Json)
          $asset=$release.assets|Where-Object{$_.name -eq $env:EXPECTED_ASSET}|Select-Object -First 1
          if(-not $asset){throw 'Required release asset missing'}
          $out="$env:RUNNER_TEMP\$env:EXPECTED_ASSET"
          curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" --output "$out"
          if($LASTEXITCODE -ne 0){throw 'Release asset download failed'}
          $got=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant();if($got -ne $env:EXPECTED_SHA256){throw "SHA mismatch $got"}
          $dst="$env:RUNNER_TEMP\rc39-source-probe";New-Item -ItemType Directory -Force -Path $dst|Out-Null;Expand-Archive -LiteralPath $out -DestinationPath $dst -Force
          $root=Get-ChildItem -Path $dst -Directory|Where-Object{$_.Name -eq 'KELVOR_RC39_CAMPAIGN_PRESENTATION_INTEGRATION_CANDIDATE_v004_20260905'}|Select-Object -First 1;if(-not $root){throw 'Candidate root missing'}
          "CAMPAIGN_ROOT=$($root.FullName)"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Scan release sources for seal/platform geometry
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP\source-probe-out";New-Item -ItemType Directory -Force -Path $out|Out-Null
          @'
          from pathlib import Path
          import os, re, json, shutil
          root=Path(os.environ['CAMPAIGN_ROOT'])/'web'
          out=Path(os.environ['RUNNER_TEMP'])/'source-probe-out'
          terms=['SEAL_DAWN','13280','13040','platformTopByX','sealsCollectedRC37']
          hits=[]; matched=set()
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.json','.html','.py','.md'}: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              lines=text.splitlines()
              for i,line in enumerate(lines,1):
                  found=[t for t in terms if t.lower() in line.lower()]
                  if found:
                      rel=p.relative_to(root).as_posix(); hits.append({'file':rel,'line':i,'terms':found,'text':line[:1000]}); matched.add(p)
          (out/'SOURCE_HITS.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SOURCE_HITS.txt').write_text('\n'.join(f"{h['file']}:{h['line']} [{','.join(h['terms'])}] {h['text']}" for h in hits),encoding='utf-8')
          copies=out/'matching_files';copies.mkdir(exist_ok=True)
          for p in sorted(matched):
              rel=p.relative_to(root); dest=copies/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dest)
          print(f'hits={len(hits)} matching_files={len(matched)}')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\probe_sources.py"
          python "$env:RUNNER_TEMP\probe_sources.py"
          "PROBE_OUT=$out"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: KELVOR-RC39-V004-SOURCE-PROBE-${{ github.run_number }}
          path: ${{ env.PROBE_OUT }}/**
          if-no-files-found: error
          retention-days: 30
